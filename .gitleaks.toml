# betterleaks reads this file (it also accepts .betterleaks.toml). Every
# default rule stays on; the allowlist below exempts four paths.
#
# Home Assistant's translation schema fixes both the `password` field key
# and its English label, so `"password": "Password"` is required text in
# every translation file and cannot be reworded. JSON carries no comments,
# so the inline allow marker cannot reach those lines. The test suite and
# its snapshots carry throwaway account literals and redacted values for
# the same reason.
[extend]
useDefault = true

[allowlist]
description = "Translation field labels and test literals are not credentials"
paths = [
  '''custom_components/ampio/strings\.json''',
  '''custom_components/ampio/translations/.*\.json''',
  '''tests/.*\.py''',
  '''tests/snapshots/.*\.ambr''',
]
