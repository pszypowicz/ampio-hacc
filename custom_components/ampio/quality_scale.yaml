rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not provide additional actions.
  appropriate-polling:
    status: exempt
    comment: |
      This integration uses a local push (MQTT) connection and does not poll.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not provide additional actions.
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: This integration does not provide additional actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: This integration does not provide an options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: todo
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: todo
  discovery: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: done
    comment: |
      A Designer save makes the M-SERV push the catalogue into every account
      namespace. The runtime data subscribes to the library's catalogue
      events and reconciles each changed object's entities against the
      platform factories, so an object added or shown appears without a
      reload on both account tiers. The admin login gets no catalogue push,
      and ampio-mqtt re-requests the admin catalogue when the pushed digest
      of the app tables changes.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: No entity has a reason to ship disabled by default.
  entity-translations: done
  exception-translations: done
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: done
  stale-devices:
    status: done
    comment: |
      Records no platform holds raise one repair issue whose fix deletes
      them. The issue is recomputed after every setup and after every
      catalogue change. The integration never deletes on its own, because
      on a restricted account a grant change looks the same as a delete.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: This integration communicates over MQTT, not an HTTP session.
  strict-typing: done
